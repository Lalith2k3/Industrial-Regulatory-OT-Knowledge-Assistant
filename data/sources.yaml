# Approved knowledge base (FR-02, US-07).
# Only sources listed here with `enabled: true` are ingested and retrievable.
# To add a document: drop the file under data/, add an entry using one of the parsers below,
# then run `python -m app.ingestion run --source <id>`.
#
# Parsers: ecfr_xml | enforcement_guidance_pdf | faq_pdf | nist_sp_pdf

sources:
  # --- Pipeline safety regulations (current text from eCFR, pinned snapshot) ---------------
  - id: ecfr-49-cfr-192
    title: "Transportation of Natural and Other Gas by Pipeline: Minimum Federal Safety Standards"
    short_title: "49 CFR Part 192"
    publisher: PHMSA
    domain: pipeline_safety
    doc_type: regulation
    parser: ecfr_xml
    path: ecfr/title-49-part-192.xml
    version: "eCFR 2026-10-05"
    effective_date: 2026-10-05
    source_url: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-192
    fetch: { title: 49, part: 192, date: 2026-10-05 }

  - id: ecfr-49-cfr-195
    title: "Transportation of Hazardous Liquids by Pipeline"
    short_title: "49 CFR Part 195"
    publisher: PHMSA
    domain: pipeline_safety
    doc_type: regulation
    parser: ecfr_xml
    path: ecfr/title-49-part-195.xml
    version: "eCFR 2026-10-05"
    effective_date: 2026-10-05
    source_url: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-195
    fetch: { title: 49, part: 195, date: 2026-10-05 }

  # --- PHMSA guidance (latest published editions) -------------------------------------------
  - id: phmsa-om-enforcement-guidance-195
    title: "Operations & Maintenance Enforcement Guidance, Part 195 Subpart F"
    short_title: "PHMSA O&M Enforcement Guidance (Part 195)"
    publisher: PHMSA
    domain: pipeline_safety
    doc_type: enforcement_guidance
    parser: enforcement_guidance_pdf
    path: phmsa/o-m-enforcement-guidance-part-195-7-21-2017.pdf
    version: "Revision 2017-07-21"
    effective_date: 2017-07-21
    source_url: https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/docs/regulatory-compliance/pipeline/enforcement/5781/o-m-enforcement-guidance-part-195-7-21-2017.pdf
    notes: >
      Explanatory guidance, not regulation. Its "Existing Code Language" field quotes the 2017
      regulation text and is intentionally not indexed; the eCFR sources are authoritative.

  - id: phmsa-oq-faq
    title: "Operator Qualification Frequently Asked Questions"

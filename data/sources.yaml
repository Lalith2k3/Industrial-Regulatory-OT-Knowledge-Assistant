    path: phmsa/PHMSA Operator Qualification FAQ Guidance.pdf
    version: "Revised 2022-01-28"
    effective_date: 2022-01-28
    source_url: https://www.phmsa.dot.gov/pipeline/operator-qualifications/oq-frequently-asked-questions

  # --- OT cybersecurity ---------------------------------------------------------------------
  - id: nist-sp-800-82r3
    title: "Guide to Operational Technology (OT) Security"
    short_title: "NIST SP 800-82r3"
    publisher: NIST
    domain: ot_security
    doc_type: standard
    parser: nist_sp_pdf
    path: nist/NIST.SP.800-82r3.pdf
    version: "Revision 3 (September 2023)"
    effective_date: 2023-09-28
    source_url: https://doi.org/10.6028/NIST.SP.800-82r3
    notes: >
      Rev. 4 is in public draft (comments due 2026-11-30); drafts are not approved sources.
    options:
      exclude: ["References", "Appendix G"]
      acronyms: "Appendix A"
      glossary: "Appendix B"
      controls: "F.7."


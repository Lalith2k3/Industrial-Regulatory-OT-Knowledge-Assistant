[project]
name = "rag-backend"
version = "0.1.0"
description = "Industrial regulatory and OT knowledge assistant - backend (ingestion, retrieval, API)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "lxml>=5.2",
    "pymupdf>=1.24",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "voyageai>=0.3",
    "tenacity>=8.5",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: tests that need the real source documents under data/",
    "db: tests that need a running PostgreSQL with pgvector",
]

[project]
name = "rag-backend"
version = "0.1.0"
description = "Industrial regulatory and OT knowledge assistant - backend (ingestion, retrieval, API)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "lxml>=5.2",
    "pymupdf>=1.24",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "voyageai>=0.3",
    "tenacity>=8.5",
    "structlog>=24.1",
    "anthropic>=2.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "lxml-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: tests that need the real source documents under data/",
    "db: tests that need a running PostgreSQL with pgvector",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, naming, ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = [
    "RUF001",  # en/em dashes and § are part of the regulatory text we parse
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["pymupdf.*", "voyageai.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships only partial annotations; allow calling its untyped functions here and nowhere else.
module = ["app.ingestion.parsing.pdf_layout", "app.ingestion.parsing.nist"]
disallow_untyped_calls = false

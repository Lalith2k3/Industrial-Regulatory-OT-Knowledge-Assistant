<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Answers from approved pipeline-safety regulations and OT security guidance, with citations." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Pipeline &amp; OT Assistant</title>
    <script>
      // Apply the saved or system theme before first paint (no flash of the wrong theme).
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
